<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Graduation Project Portal</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your.email@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">

        <p id="msg"></p>

        <button onclick="login()">Login</button>
        <button class="secondary" onclick="window.location.href='/register.html'">Register</button>
    </div>

    <script src="/app.js">

</script>
    <script>

        getCurrentUser().then(function(user) {
            if (!user.error) redirectByRole(user.role);
        }).catch(function() {  });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
        document.getElementById('email').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        function login() {
            clearMessage('msg');
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) {
                showError('msg', 'Please enter your email and password.');
                return;
            }

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            }).then(function(r) { return r.json(); })
            .then(function(result) {
                if (result.error) {
                    showError('msg', result.error);
                } else {
                    redirectByRole(result.role);
                }
            }).catch(function(err) {
                showError('msg', 'Login failed. Please try again.');
            });
        }
</script>
</body>
</html>
